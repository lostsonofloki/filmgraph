name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --project=chromium
      env:
        # The specs read TEST_USER_EMAIL/TEST_USER_PASSWORD (as does .env.example and
        # scripts/actor-badge-check.cjs); this job used to export TEST_EMAIL/TEST_PASSWORD, so
        # every authenticated spec saw no credentials at all. Either secret name is accepted so
        # the existing repository secrets keep working.
        TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || secrets.TEST_EMAIL }}
        TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || secrets.TEST_PASSWORD }}
        # Was https://ignes-azure.vercel.app, a hostname from before the project was renamed.
        PLAYWRIGHT_BASE_URL: https://filmgraph.app
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
